name: udp-ruteo-fase2
x-app: &app
  platform: linux/amd64
  image: udp-ruteo-fase2-app:local
  build:
    context: .
    dockerfile: docker/Dockerfile.app
    args:
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
  init: true
  networks: [backend]
  environment: &db-env
    DB_HOST: db
    DB_PORT: '5432'
    DB_NAME: ${POSTGRES_DB:-ruteo}
    DB_USER: ${POSTGRES_USER:-postgres}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Ejecutar ./main para generar .env}
services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.8.0@sha256:4c480c7f9e25a3490573cd6ef86b286fd21162e288cc355e8da2b52518ef6ab8
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruteo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecutar ./main para generar .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 40
    restart: unless-stopped
  etl:
    <<: *app
    environment:
      <<: *db-env
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?Ejecutar ./main para generar .env}
    volumes:
      - ./datos/runs:/app/datos/runs
      - ./datos/entrada/vial:/app/datos/entrada/vial
      - ./datos/entrada/aereo:/app/datos/entrada/aereo
      - ./datos/entrada/aereo_v2:/app/datos/entrada/aereo_v2
      - ./datos/entrada/vigilancia:/app/datos/entrada/vigilancia
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  web:
    <<: *app
    command: [python, -m, core.web]
    environment:
      <<: *db-env
      DB_USER: routing_web
      DB_PASSWORD: ${WEB_DB_PASSWORD:?Ejecutar ./main para generar .env}
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8000']
    volumes:
      - ./datos/entrada/vigilancia:/app/datos/entrada/vigilancia:ro
    depends_on:
      db: {condition: service_healthy}
      etl: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, core.health]
      interval: 5s
      timeout: 6s
      retries: 15
      start_period: 10s
    restart: unless-stopped
volumes:
  pgdata:
networks:
  backend:
