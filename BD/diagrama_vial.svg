<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120"><rect width="1320" height="1120" fill="#f8faf8"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#567875"/></marker></defs><text x="40" y="43" font-family="Arial,sans-serif" font-size="30" fill="#233f41">Valparaíso · esquema ampliado a 25 tablas</text><text x="40" y="76" font-family="Arial,sans-serif" font-size="19" fill="#233f41">Núcleo vial y claves principales. Las FK incluyen run_id: no mezclan instantáneas.</text><polyline points="380,170 460,170" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="402" y="157" font-family="Arial,sans-serif" font-size="14" fill="#233f41">1:N</text><polyline points="630,244 630,310" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="640" y="280" font-family="Arial,sans-serif" font-size="14" fill="#233f41">I / 1:N</text><polyline points="500,244 500,270 210,270 210,310" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240" y="260" font-family="Arial,sans-serif" font-size="14" fill="#233f41">I / 1:N</text><polyline points="380,360 460,360" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="397" y="348" font-family="Arial,sans-serif" font-size="14" fill="#233f41">2 FK</text><polyline points="380,420 410,420 410,510 850,510 850,380 880,380" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="580" y="499" font-family="Arial,sans-serif" font-size="14" fill="#233f41">nodo de incorporación</text><polyline points="630,478 630,560" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="640" y="544" font-family="Arial,sans-serif" font-size="14" fill="#233f41">arco de llegada</text><polyline points="460,610 380,610" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="397" y="596" font-family="Arial,sans-serif" font-size="14" fill="#233f41">2 FK</text><polyline points="460,455 425,455 425,690 380,690" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="250" y="725" font-family="Arial,sans-serif" font-size="14" fill="#233f41">arco entrante</text><polyline points="210,120 210,103 1050,103 1050,310" fill="none" stroke="#567875" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1070" y="230" font-family="Arial,sans-serif" font-size="14" fill="#233f41">run / 1:0..1</text><rect x="40" y="120" width="340" height="120" rx="6" fill="#ffffff" stroke="#689581"/><text x="55" y="149" font-family="Arial,sans-serif" font-size="20" fill="#233f41">runs</text><text x="55" y="177" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK run_id UUID</text><text x="55" y="201" font-family="Arial,sans-serif" font-size="16" fill="#233f41">input_hash / scope / mode</text><text x="55" y="225" font-family="Arial,sans-serif" font-size="16" fill="#233f41">status / configuration</text><rect x="460" y="120" width="340" height="120" rx="6" fill="#ffffff" stroke="#689581"/><text x="475" y="149" font-family="Arial,sans-serif" font-size="20" fill="#233f41">datasets</text><text x="475" y="177" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK dataset_id; UQ run + key</text><text x="475" y="201" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK run_id / source_id</text><text x="475" y="225" font-family="Arial,sans-serif" font-size="16" fill="#233f41">file_sha256 / lineage / validation</text><rect x="40" y="310" width="340" height="144" rx="6" fill="#ffffff" stroke="#689581"/><text x="55" y="339" font-family="Arial,sans-serif" font-size="20" fill="#233f41">nodes</text><text x="55" y="367" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK (run_id, id BIGINT)</text><text x="55" y="391" font-family="Arial,sans-serif" font-size="16" fill="#233f41">UQ (run_id, natural_key)</text><text x="55" y="415" font-family="Arial,sans-serif" font-size="16" fill="#233f41">vial / base_candidata / legado</text><text x="55" y="439" font-family="Arial,sans-serif" font-size="16" fill="#233f41">geom Point, EPSG:32719</text><rect x="460" y="310" width="340" height="168" rx="6" fill="#ffffff" stroke="#689581"/><text x="475" y="339" font-family="Arial,sans-serif" font-size="20" fill="#233f41">edges</text><text x="475" y="367" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK (run_id, id BIGINT)</text><text x="475" y="391" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK source, target → nodes</text><text x="475" y="415" font-family="Arial,sans-serif" font-size="16" fill="#233f41">UQ (run_id, source, target)</text><text x="475" y="439" font-family="Arial,sans-serif" font-size="16" fill="#233f41">geom LineString / road_origin</text><text x="475" y="463" font-family="Arial,sans-serif" font-size="16" fill="#233f41">length_km = ST_Length / 1000</text><rect x="880" y="310" width="340" height="144" rx="6" fill="#e6f2e8" stroke="#689581"/><text x="895" y="339" font-family="Arial,sans-serif" font-size="20" fill="#233f41">base_locations · nueva</text><text x="895" y="367" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK/FK run_id → runs</text><text x="895" y="391" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK node_id → nodes</text><text x="895" y="415" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK source_id → sources</text><text x="895" y="439" font-family="Arial,sans-serif" font-size="16" fill="#233f41">geom real / name / provenance</text><rect x="460" y="560" width="340" height="120" rx="6" fill="#e6f2e8" stroke="#689581"/><text x="475" y="589" font-family="Arial,sans-serif" font-size="20" fill="#233f41">road_states · nueva</text><text x="475" y="617" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK (run_id, id)</text><text x="475" y="641" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK edge_id → edges</text><text x="475" y="665" font-family="Arial,sans-serif" font-size="16" fill="#233f41">context BIGINT[] de giros</text><rect x="40" y="560" width="340" height="144" rx="6" fill="#e6f2e8" stroke="#689581"/><text x="55" y="589" font-family="Arial,sans-serif" font-size="20" fill="#233f41">road_transitions · nueva</text><text x="55" y="617" font-family="Arial,sans-serif" font-size="16" fill="#233f41">PK (run_id, id)</text><text x="55" y="641" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK source, target → states</text><text x="55" y="665" font-family="Arial,sans-serif" font-size="16" fill="#233f41">FK edge_id → edges</text><text x="55" y="689" font-family="Arial,sans-serif" font-size="16" fill="#233f41">UQ run + source + target</text><text x="40" y="786" font-family="Arial,sans-serif" font-size="20" fill="#233f41">Las 18 tablas anteriores restantes se conservan sin sustituir sus funciones:</text><rect x="40" y="810" width="270" height="120" rx="6" fill="#ffffff" stroke="#689581"/><text x="55" y="839" font-family="Arial,sans-serif" font-size="20" fill="#233f41">Procedencia (3)</text><text x="55" y="867" font-family="Arial,sans-serif" font-size="16" fill="#233f41">schema_migrations</text><text x="55" y="891" font-family="Arial,sans-serif" font-size="16" fill="#233f41">sources</text><text x="55" y="915" font-family="Arial,sans-serif" font-size="16" fill="#233f41">publication</text><rect x="340" y="810" width="270" height="144" rx="6" fill="#ffffff" stroke="#689581"/><text x="355" y="839" font-family="Arial,sans-serif" font-size="20" fill="#233f41">Metadata (4)</text><text x="355" y="867" font-family="Arial,sans-serif" font-size="16" fill="#233f41">base_metadata</text><text x="355" y="891" font-family="Arial,sans-serif" font-size="16" fill="#233f41">landcover</text><text x="355" y="915" font-family="Arial,sans-serif" font-size="16" fill="#233f41">node_elevation</text><text x="355" y="939" font-family="Arial,sans-serif" font-size="16" fill="#233f41">weather</text><rect x="640" y="810" width="300" height="120" rx="6" fill="#ffffff" stroke="#689581"/><text x="655" y="839" font-family="Arial,sans-serif" font-size="20" fill="#233f41">Amenazas (6)</text><text x="655" y="867" font-family="Arial,sans-serif" font-size="16" fill="#233f41">hazards / weather_hazards</text><text x="655" y="891" font-family="Arial,sans-serif" font-size="16" fill="#233f41">thermal_events / airspace_zones</text><text x="655" y="915" font-family="Arial,sans-serif" font-size="16" fill="#233f41">historical_risk / edge_hazard</text><rect x="970" y="810" width="310" height="120" rx="6" fill="#ffffff" stroke="#689581"/><text x="985" y="839" font-family="Arial,sans-serif" font-size="20" fill="#233f41">Rutas y evaluación (5)</text><text x="985" y="867" font-family="Arial,sans-serif" font-size="16" fill="#233f41">profiles / route_sets</text><text x="985" y="891" font-family="Arial,sans-serif" font-size="16" fill="#233f41">routes / route_edges</text><text x="985" y="915" font-family="Arial,sans-serif" font-size="16" fill="#233f41">evaluations</text><text x="40" y="1030" font-family="Arial,sans-serif" font-size="19" fill="#233f41">El autómata recuerda giros; sus estados no son calles ni nodos físicos nuevos.</text><text x="40" y="1064" font-family="Arial,sans-serif" font-size="18" fill="#233f41">Creación desde cero: BD/crear_bd.sql + BD/migraciones/002_red_vial.sql, aplicados por main.</text><text x="40" y="1095" font-family="Arial,sans-serif" font-size="17" fill="#233f41">DDL completo y relaciones adicionales: crear_bd.sql y diagrama.dot (modelo inicial de 22 tablas).</text></svg>